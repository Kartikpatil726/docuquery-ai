services:
  backend:
    build:
      context: ./backend
      args:
        WITH_LOCAL_EMBEDDINGS: 'true'
    env_file: .env
    environment:
      DATA_DIR: /data
      CORS_ORIGINS: http://localhost:8501
    volumes:
      - docuquery_data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
      API_KEY: ${API_KEY:-}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8501:8501"

volumes:
  docuquery_data:
